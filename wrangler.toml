# wrangler.toml — Cloudflare Worker config for stillWeather lightning & radar status
# ──────────────────────────────────────────────────────────────────────────────
# Deploy with:  npx wrangler deploy
#
# R2 Bucket Binding:
#   Reads `status.json` uploaded by the homelab GOES-19 GLM + IEM NEXRAD daemon.
#   No API key or Wrangler secret is required for R2 binding reads.
# ──────────────────────────────────────────────────────────────────────────────

name               = "stillweather-lightning"
main               = "lightning-proxy.js"
compatibility_date = "2024-11-01"

[[r2_buckets]]
binding     = "STATUS_BUCKET"
bucket_name = "stillweather"
